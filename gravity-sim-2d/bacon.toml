default_job = "run-long"
env.CARGO_TERM_COLOR = "always"

grace_period = "100ms"

[jobs.run-long]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
scroll_anchor = "auto"
# kill = ["pkill", "-TERM", "-P"]   # uncomment if the binary survives the default kill

[keybindings]
r = "job:run-long"